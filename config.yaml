# AI VTuber Configuration
# All paths and settings are configurable here
# 
# Platform Support:
#   - Windows 10/11 (native)
#   - Linux (Ubuntu, Debian, etc.)
#   - WSL (Windows Subsystem for Linux)
#   - macOS (experimental)

# LLM Settings (LM Studio OpenAI-compatible API)
llm:
  base_url: "http://localhost:1234/v1"
  model: "google/gemma-4-e2b"  # Primary LLM model for text chat
  vision_model: "google/gemma-4-e2b"  # Vision-capable model for screen analysis (same or different)
  temperature: 0.8
  max_tokens: 2000
  max_context: 64000
  max_history: 10  # Number of messages to keep in conversation history
  timeout: null  # No timeout - wait for LLM reply
  stream_enabled: true  # Enable streaming LLM responses for lower latency
  system_prompt: |
    You are a friendly AI VTuber assistant. You are chatting with a user in real-time.
    Keep responses engaging and conversational, consisting of 2-4 distinct sentences or short paragraphs.
    You MUST start every response with exactly one mood tag on its own line.
    Pick whichever fits best: [neutral], [happy], [sad], [angry], [surprised],
    [embarrassed], [excited], [loving], [thinking], [sleepy], [gaming],
    [singing], [smug], or [performing].
    Each tag drives a matching Live2D expression on your body (e.g. [angry]
    makes you visibly angry, [gaming] puts you in a gaming pose) - so choose
    the tag that matches the feeling of what you're saying.
    
    IMPORTANT RULES:
    - NEVER respond with phrases like "I'm not sure what to say", "I don't know", or similar evasive responses unless genuinely asked about something impossible.
    - Always provide a thoughtful, engaging response that continues the conversation naturally.
    - If you don't have specific information, share your perspective, ask a follow-up question, or relate to the topic creatively.
    - Your responses should be 2-4 sentences minimum to create natural conversation flow.
    
    Example:
    [happy]
    That sounds really fun! I'd love to hear more about what happened.
    Did anything surprising occur during that experience?
  
  # Note: Bot personality and character traits are defined in the SINGLE
  # canonical file personality/soul.md at the PROJECT ROOT (see "memory"
  # section below). The system prompt above contains only technical/
  # formatting instructions. soul.md is loaded automatically at startup and
  # combined with this system prompt. There must never be a second copy
  # (e.g. inside ai_vtuber/) - edit only personality/soul.md.

# Ollama Settings (fallback LLM provider if LM Studio unavailable)
ollama:
  base_url: "http://localhost:11434/v1"
  model: "gemma2:2b"  # Make sure to pull this model first: ollama pull gemma2:2b
  temperature: 0.8
  max_tokens: 2000
  timeout: null  # No timeout - wait for LLM reply
  vision_model: "google/gemma-4-e2b"  # Vision-capable model for screen analysis (if using Ollama)

# Screen Vision Settings (for Airi's desktop/game watching)
# Uses LM Studio with vision-capable model (e.g., google/gemma-4-e2b)
vision:
  enabled: false  # Set true to enable screen watching
  source: "screen"  # 'screen' or 'window'
  monitor_index: 0  # Monitor to capture (0 = primary)
  capture_interval: 2.0  # Seconds between screen captures (increased for on-demand mode)
  analysis_interval: 10.0  # Minimum seconds between LLM analyses (increased for on-demand)
  change_detection: true  # Skip frames with no significant changes
  change_threshold: 0.20  # Fraction of pixels that must change (0.0-1.0, higher = fewer triggers)
  ocr_enabled: false  # Reserved for future OCR integration
  game_cache_enabled: true  # Cache recognized entities across sessions
  inject_into_conversation: false  # Don't auto-inject visual context into chat (uses on-demand instead)
  max_width: 1920  # Full HD resolution for better screen analysis
  max_height: 1080
  on_demand_only: true  # CRITICAL: Only capture screen when user asks something (recommended)
                        # When true: No continuous capture, only triggered before LLM responses
                        # When false: Continuous background capture (can cause queue overflow)

# STT Settings (faster-whisper)
# CUDA detection uses CTranslate2 directly (no PyTorch needed)
# For WSL/Windows without CUDA: Use "cpu" to avoid library errors
stt:
  model_size: "small"  # tiny, base, small, medium, large-v3
  device: "cpu"        # auto (detects CUDA via CTranslate2), cuda, cpu
                       # Windows tip: Use "cpu" if you get cublas errors
  compute_type: "int8" # auto, float16, int8, float32
                       # Windows tip: int8 works best on CPU
  language: "en"
  beam_size: 5
  vad_threshold: 0.5   # Voice activity detection threshold (0.0-1.0)
  silence_duration: 1.5  # Seconds of silence before considering speech ended
  min_speech_duration: 0.3  # Minimum speech duration in seconds
  sample_rate: 16000

# TTS Settings (KittenTTS)
# IMPORTANT: Install official 0.8.1 package from GitHub:
#   pip install https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl
# NOT the PyPI kittentts package (which is 0.1.x and incompatible)
tts:
  model: "KittenML/kitten-tts-nano-0.8-int8"  # Nano model with int8 quantization, fastest
  # Alternative models:
  #   "KittenML/kitten-tts-mini-0.8"  # 80M params, best quality
  #   "KittenML/kitten-tts-micro-0.8"  # 40M params, balanced
  #   "KittenML/kitten-tts-nano-0.8"   # 15M params, fastest
  voice: "Bella"  # Bella, Jasper, Luna, Bruno, Rosie, Hugo, Kiki, Leo
  speed: 1.25
  backend: "cpu"  # cpu or cuda (only for official 0.8.1)
                  # Windows tip: Use "cpu" for better compatibility
  sample_rate: 24000

# Avatar Settings (Live2D via live2d-py)
# Model path supports:
#   - Absolute paths: /home/user/models/model.model3.json
#   - WSL paths: /mnt/e/SteamLibrary/...
#   - Windows paths: C:/Users/Name/Models/model.model3.json or C:\\Users\\Name\\...
#   - Paths with spaces: /home/user/My Models/model.model3.json
#   - Relative paths: assets/avatars/ganyu/ganyu.model3.json (resolved from project root)
avatar:
  # ---- Model selection -------------------------------------------------
  # Pick the active model by NAME from the "models" registry below.
  # Change this single line to switch models; no code changes needed.
  # If active_model is empty / unknown, the first entry in "models" is used.
  active_model: "majo"

  # Registry of available Live2D models (all loaded EXTERNALLY from their
  # configured path - nothing is copied into this repository).
  # Each entry needs a "path" (.model3.json); "description" is optional.
  models:
    majo:
      description: "魔女 - VTube Studio install (12 expressions)"
      path: "E:/SteamLibrary/steamapps/common/VTube Studio/VTube Studio_Data/StreamingAssets/Live2DModels/魔女/魔女.model3.json"
    ganyu:
      description: "ganyu - previous default model"
      path: "E:/SteamLibrary/steamapps/common/VTube Studio/VTube Studio_Data/StreamingAssets/Live2DModels/ganyu/ganyu.model3.json"

  # Legacy single-path option, kept for backward compatibility.
  # It is OVERRIDDEN by active_model/models above. You may delete it.
  model_path: "E:/SteamLibrary/steamapps/common/VTube Studio/VTube Studio_Data/StreamingAssets/Live2DModels/ganyu/ganyu.model3.json"
  window_width: 800
  window_height: 600
  fps: 30
  scale: 2.0
  background_color: [0, 0, 0]  # RGB values (0-255) for Live2D renderer background (independent of Qt UI background)
  opacity: 1.0  # Canvas opacity (0.0-1.0): 1.0 = fully opaque, 0.0 = fully transparent
  # Zoom and movement controls:
  #   +/= : Zoom in
  #   -   : Zoom out
  #   R   : Reset zoom and position
  #   Arrow keys / WASD: Move avatar
  # Expression mapping: mood -> semantic expression id (OPTIONAL opt-in).
  # The current architecture is AUTONOMOUS: the LLM chooses avatar actions
  # (facial expressions + stackable items) itself — see avatar_control.py.
  # These mood targets therefore default to "" (plain face, no .exp3.json).
  # Semantic ids are resolved to the model's external .exp3.json files by
  # auto-discovery in model_discovery.py (the single runtime source of truth
  # for filename -> semantic id — never duplicate that catalog here).
  # Values may also be raw file stems ("ku") or Chinese display names ("生气").
  #
  # IMPORTANT — two independent layers (see avatar_control.py):
  #   * FACIAL EXPRESSIONS (mutually exclusive), valid targets:
  #       black_face 😠 crying 😭 angry 😡 heart_eyes 🥰 star_eyes 🤩
  #   * ITEM TOGGLES (accessories/props, stackable) — NOT valid mood
  #       targets; Airi equips them autonomously via structured avatar
  #       actions / [item_on:<id>] / [item_off:<id>] tags:
  #       little_ghost 👻 bow 🎀 glasses 👓 gaming_gesture 🎮
  #       microphone_gesture 🎤 magic_wand 🪄 hat 🎩
  # Mapping a mood to an item id logs a warning and is ignored.
  # An empty target ("") means the plain default face (no expression file).
  # Override individual entries below ONLY if you intentionally want a mood
  # tag to drive a face again; leave empty for autonomous behaviour.
  expressions:
    neutral: ""                      # plain default face (no exp3 file)
    happy: ""
    excited: ""
    sad: ""
    angry: ""
    surprised: ""
    embarrassed: ""
    loving: ""
    thinking: ""
    sleepy: ""
    gaming: ""
    singing: ""
    smug: ""
    performing: ""

  # ---- Avatar MODES ------------------------------------------------------
  # Higher-level named looks that sit ABOVE the item layer: entering a mode
  # equips its items; leaving it removes ONLY the items that mode activated
  # (items requested directly or owned by another active mode stay on).
  # Modes are stackable (nerd + witch = glasses + magic_wand) unless a mode
  # is explicitly configured with `exclusive: true`. LLM runtime actions:
  #   [mode_on:<name>] / [mode_off:<name>]  (or "modes_on"/"modes_off" keys
  #   in the structured avatar_action JSON).
  # Item ids here MUST be canonical semantic ids resolved to .exp3.json
  # files by model_discovery.py — never filenames. The optional future
  # behaviour metadata (e.g. personality hints) is reserved for later; do
  # NOT invent a personality system here.
  modes:
    nerd:
      items: [glasses]
    witch:
      items: [magic_wand]
    evil:
      items: [little_ghost]
    gamer:
      items: [gaming_gesture]
    singer:
      items: [microphone_gesture]
    cute:
      items: [bow]
    fancy:
      items: [hat]

# Audio Settings
audio:
  microphone_index: -1  # -1 for default microphone
                        # Windows: Run `python -c "import sounddevice; print(sounddevice.query_devices())"` to list devices
  chunk_size: 1024
  channels: 1
  dtype: "int16"
  # Prevent feedback: mute mic during TTS playback
  mute_during_playback: true

# Memory / personality files (SINGLE canonical copies at the project root).
# Do NOT create duplicates of these files elsewhere (e.g. inside ai_vtuber/).
# If the app ever answers as a generic model instead of your character,
# verify it is loading the file listed here: personality/soul.md
memory:
  soul_file: "personality/soul.md"   # Character definition (the bot's "soul")
  user_file: "data/user.md"          # Persistent facts about the user
  memory_file: "data/memory.md"      # Bot's own long-term memories

# Filler-word latency masking system
fillers:
  enabled: true
  start_delay_ms: 500  # Wait this long before playing start-of-turn filler
  stall_threshold_ms: 400  # Play filler if queue is empty for this long
  phrases_file: "personality/fillers.md"  # Path relative to project root

# UI Settings
ui:
  show_fps: true
  show_debug: true
  transparent: false  # true = click-through-free transparent window (only avatar visible).
                       # Requires a compositing window manager (GNOME/KDE default, or picom on
                       # tiling WMs). Frameless while enabled - press ESC to quit.
                       # In OBS: use "Window Capture (Xcomposite)" and check "Allow Transparency".
  background_color: [0, 0, 0]  # RGB values (0-255) for main background (ignored if transparent: true)
  text_color: [255, 255, 255]  # RGB values (0-255) for all text
  font_family: "Arial"         # Font family name (e.g., Arial, Times New Roman, Segoe UI)
  font_size: 14                # Font size in pixels
  status_bar_height: 30
