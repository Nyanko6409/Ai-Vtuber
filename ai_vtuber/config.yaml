# AI VTuber Configuration
# All paths and settings are configurable here

# LLM Settings (LM Studio OpenAI-compatible API)
llm:
  base_url: "http://localhost:1234/v1"
  model: "gemma-4-e4b"
  temperature: 0.8
  max_tokens: 300
  max_history: 10  # Number of messages to keep in conversation history
  system_prompt: |
    You are a friendly AI VTuber assistant. You are chatting with a user in real-time.
    Keep responses concise and conversational (1-3 sentences).
    You MUST start every response with exactly one emotion tag on its own line:
    [neutral], [happy], [excited], [thinking], [surprised], [sad], [angry], or [sleepy]
    
    Example:
    [happy]
    That sounds really fun! Tell me more!

# STT Settings (faster-whisper)
stt:
  model_size: "small"  # tiny, base, small, medium, large-v3
  device: "auto"       # auto, cuda, cpu
  compute_type: "auto" # auto, float16, int8, float32
  language: "en"
  beam_size: 5
  vad_threshold: 0.5   # Voice activity detection threshold (0.0-1.0)
  silence_duration: 1.5  # Seconds of silence before considering speech ended
  min_speech_duration: 0.3  # Minimum speech duration in seconds
  sample_rate: 16000

# TTS Settings (KittenTTS)
tts:
  model: "KittenML/kitten-tts-mini-0.8"
  voice: "Bella"
  speed: 1.0
  backend: "cpu"  # cpu or cuda
  sample_rate: 24000

# Avatar Settings (Live2D via live2d-py)
avatar:
  model_path: ""  # Path to .model3.json or .model.json file
  window_width: 800
  window_height: 600
  fps: 30
  scale: 2.0
  # Expression mapping: emotion -> expression file name or group
  expressions:
    neutral: "neutral"
    happy: "happy"
    excited: "happy"
    thinking: "neutral"
    surprised: "surprised"
    sad: "sad"
    angry: "angry"
    sleepy: "sleepy"

# Audio Settings
audio:
  microphone_index: -1  # -1 for default microphone
  chunk_size: 1024
  channels: 1
  dtype: "int16"
  # Prevent feedback: mute mic during TTS playback
  mute_during_playback: true

# UI Settings
ui:
  show_fps: true
  show_debug: true
  background_color: [30, 30, 40]
  text_color: [255, 255, 255]
  font_size: 14
  status_bar_height: 40
  text_area_height: 120
